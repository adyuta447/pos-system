name: pos_ui
description: Design system POS. Tidak tahu role dan tidak tahu database.
publish_to: none
resolution: workspace
environment:
  sdk: ^3.14.0
dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.5.0
  lucide_icons_flutter: ^4.0.3
  material_ui: ^1.1.0
  pos_core: any
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  assets:
    - assets/illustrations/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
